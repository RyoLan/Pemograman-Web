
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Pemrograman Web 1</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #202124;
            font-family: Arial, sans-serif;
            color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: #2d2f33;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5),
                        0 5px 12px rgba(0,0,0,0.3);
            border: 1px solid #3b3d42;
        }

        .header {
            margin-bottom: 30px;
        }

        .header span {
            color: #5b9cf5;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 28px;
            margin-top: 15px;
            margin-bottom: 12px;
            color: white;
        }

        .subtitle {
            color: #aaa;
            font-size: 14px;
            line-height: 1.7;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .paragraph {
            background-color: #36383d;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #4d8fe8;
            color: #c9c9c9;
            font-size: 14px;
            line-height: 1.8;
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .paragraph:hover {
            background-color: #3c3f45;
            transform: translateY(-3px);
        }

        .paragraph strong {
            display: block;
            color: #70a9f5;
            margin-bottom: 6px;
        }

        .clock {
            margin-top: 20px;
            padding: 18px;
            background-color: #24262a;
            border-radius: 8px;
            border: 1px solid #44464b;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
        }

        .clock p {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }

        #tanggal {
            color: #70a9f5;
            font-size: 14px;
        }

        #jam {
            font-size: 27px;
            font-weight: bold;
            color: white;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            padding: 12px 22px;
            background-color: #397dcc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #2866ae;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(57,125,204,0.25);
        }

        button:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #44464b;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 18px;
            }

            h1 {
                font-size: 23px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <span>WEB PROGRAMMING</span>
            <h1>Tugas Pemrograman Web 1</h1>
            <p class="subtitle">
                Welcome
            </p>
        </div>

        <div class="content">

            <div class="paragraph">
                <strong>Paragraf Pertama</strong>
                Hello World
            </div>

            <div class="paragraph">
                <strong>Paragraf Kedua</strong>
                <p id="paragraf-interaktif">
                    Teks ini akan berubah
                    ketika tombil di klik A
                </p>
            </div>

            <div class="paragraph">
                <strong>Paragraf Ketiga</strong>
                Test
            </div>

        </div>

        <!-- Tanggal dan Jam -->
        <div class="clock">
            <p>TANGGAL DAN WAKTU SAAT INI</p>
            <div id="tanggal">Memuat tanggal...</div>
            <div id="jam">00:00:00</div>
        </div>

        <!-- Tombol Interaksi -->
        <div class="buttons">
            <button onclick="tampilkanAlert()">
                Tampilkan Alert
            </button>

            <button onclick="ubahTeks()">
                Ubah Teks
            </button>
        </div>

        <div class="footer">
            © 2026 | Tugas Pemrograman Web 1
        </div>

    </div>

    <script>

        // 1. Menampilkan Alert
        function tampilkanAlert() {
            alert("Hello World");
        }

        // 2. Mengubah Teks pada Halaman
        function ubahTeks() {
            document.getElementById("paragraf-interaktif").innerText =
                "Teks berhasil diubah menggunakan JavaScript";

            alert("Teks paragraf berhasil diubah!");
        }

        // 3. Menampilkan Tanggal dan Jam
        function updateWaktu() {
            const sekarang = new Date();

            const tanggal = sekarang.toLocaleDateString("id-ID", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            const jam = sekarang.toLocaleTimeString("id-ID", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });

            document.getElementById("tanggal").innerText = tanggal;
            document.getElementById("jam").innerText = jam;
        }

        // Memperbarui waktu setiap satu detik
        updateWaktu();
        setInterval(updateWaktu, 1000);

    </script>

</body>
</html>
